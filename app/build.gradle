plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.affiliatehunter'
    compileSdk 34

    defaultConfig {
        applicationId "com.affiliatehunter"
        minSdk 24      // Android 7.0 Nougat
        targetSdk 34   // Android 14
        versionCode 1
        versionName "2.0.0-OP"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Enable Room schema export for migration tracking
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schema.json": "$projectDir/schemas".toString(), "room.incremental": "true"]
            }
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'  // stable w/ Kotlin 1.9.24
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,GPL2.0}'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/keystore/release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "affiliatehunter123"
            keyAlias System.getenv("KEY_ALIAS") ?: "affiliatehunter"
            keyPassword System.getenv("KEY_PASSWORD") ?: "affiliatehunter123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                jvmArgs '-Xmx3g', '-XX:+HeapDumpOnOutOfMemoryError'
                maxHeapSize = "3g"
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "AffiliateHunter-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // ── AndroidX ─────────────────────────────────────────────
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.core:core-splashscreen:1.0.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.2"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // ── Material Design 3 ─────────────────────────────────────
    implementation "androidx.compose.ui:ui:1.6.8"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.8"
    implementation "androidx.compose.material3:material3:1.2.1"
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.8"

    // Material icons
    implementation "androidx.compose.material:material-icons-extended:1.6.8"

    // Animation
    implementation "androidx.compose.animation:animation:1.6.8"

    // ── Room (SQLite ORM) ─────────────────────────────────────
    def room_version = "2.6.1"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // ── Kotlin Coroutines ─────────────────────────────────────
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"

    // ── Coil (image loading) ─────────────────────────────────
    implementation "io.coil-kt:coil-compose:2.6.0"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jsoup:jsoup:1.17.2"

    // ── Google Material 3 Components ─────────────────────────
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // ── Hilt (Dependency Injection) ────────────────────────────
    implementation "com.google.dagger:hilt-android:2.52"
    kapt "com.google.dagger:hilt-android-compiler:2.52"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // ── DataStore (preferences — replaces SharedPreferences API) ──
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // ── Kotlin CSV (export reports) — use Apache Commons CSV from Maven Central
    implementation "org.apache.commons:commons-csv:1.10.0"

    // ── esc-pos-printer removed: ReceiptPrinter uses raw ESC/POS via BluetoothSocket

    // ── Bar charts replaced: ReportScreen uses Compose Canvas native bar chart

    // ── Accompanist (permissions helper) ──────────────────────
    implementation "com.google.accompanist:accompanist-permissions:0.34.0"

    // ── QR Code (QRIS placeholder scan — optional) ─────────────
    // ML Kit barcode scanning removed - not yet implemented

    // ── Testing — host (Robolectric) + instrumentation ───────────
    // Host tests (src/test) — Robolectric + Compose ui-test (pin 1.6.8 sama kayak implementation)
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.13"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "androidx.compose.ui:ui-test:1.6.8"
    testImplementation "androidx.compose.ui:ui-test-junit4:1.6.8"
    testImplementation "androidx.compose.ui:ui-test-manifest:1.6.8"
    // Manifest helper for createComposeRule (must be debugImplementation)
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.6.8"
    // Instrumentation (src/androidTest)
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.6.8"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
