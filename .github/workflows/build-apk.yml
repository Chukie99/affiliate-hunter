# Auto-build & release AffiliateHunter APK — triggered on every version tag (v*)

name: build-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK (with QC gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Android SDK  (API 34 + build-tools)
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'

      - name: Generate release keystore (CI)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.keystore ]; then
            keytool -genkeypair -keystore keystore/release.keystore -alias affiliatehunter -keyalg RSA -keysize 2048 -validity 10000 -storepass affiliatehunter123 -keypass affiliatehunter123 -dname "CN=AffiliateHunter, OU=Dev, O=AffiliateHunter, L=Jakarta, ST=DKI, C=ID"
          fi
          ls -lh keystore/release.keystore

      - name: "QC gate: host unit tests (Robolectric — FAB → Tambah Produk)"
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: "QC gate: Android Lint"
        run: ./gradlew lintDebug --stacktrace

      - name: Upload QC reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qc-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: affiliatehunter123
          KEY_ALIAS: affiliatehunter
          KEY_PASSWORD: affiliatehunter123
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "basename=$(basename "$APK")" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: affiliatehunter-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk }}

      - name: Create / publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.apk }}
            # admin/serial-generator.html removed — no file
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
